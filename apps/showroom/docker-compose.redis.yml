# Optional Redis overlay for shared L2 cache + Pub/Sub invalidation.
# Usage: docker compose -f docker-compose.yml -f docker-compose.redis.yml up

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    depends_on:
      redis:
        condition: service_healthy
    environment:
      CACHE_BACKEND: redis
      REDIS_URL: redis://redis:6379
