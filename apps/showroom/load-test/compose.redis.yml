# L1 + L2 Redis tiered cache — dağıtık lock, write-through, Pub/Sub invalidation.

services:
  app:
    depends_on:
      mock-gw:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CACHE_BACKEND: redis
      CACHE_REQUIRED: "true"
      REDIS_URL: redis://redis:6379
