<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SSR request pipeline illustration</title>
  <desc id="desc">A browser request flows through Hono, cache, gateway and React rendering layers.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="0.55" stop-color="#1e40af"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#93c5fd" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#dbeafe" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#93c5fd" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="48" fill="url(#background)"/>
  <circle cx="1390" cy="90" r="330" fill="#60a5fa" opacity="0.14"/>
  <circle cx="130" cy="830" r="410" fill="#0f172a" opacity="0.2"/>
  <path d="M90 450H1510" stroke="url(#beam)" stroke-width="5"/>
  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(105 300)">
      <rect width="280" height="300" rx="34" fill="#eff6ff"/>
      <rect x="34" y="42" width="212" height="132" rx="16" fill="#bfdbfe"/>
      <circle cx="140" cy="232" r="20" fill="#2563eb"/>
      <text x="140" y="278" fill="#172554" font-size="30" font-weight="700">Browser</text>
    </g>
    <g transform="translate(470 300)">
      <rect width="280" height="300" rx="34" fill="#ffffff"/>
      <path d="M72 95h136M72 145h136M72 195h92" stroke="#2563eb" stroke-width="20" stroke-linecap="round"/>
      <text x="140" y="278" fill="#172554" font-size="30" font-weight="700">Hono</text>
    </g>
    <g transform="translate(835 300)">
      <rect width="280" height="300" rx="34" fill="#eff6ff"/>
      <ellipse cx="140" cy="82" rx="82" ry="34" fill="#60a5fa"/>
      <path d="M58 82v104c0 19 37 35 82 35s82-16 82-35V82" fill="#93c5fd"/>
      <ellipse cx="140" cy="186" rx="82" ry="35" fill="#bfdbfe"/>
      <text x="140" y="278" fill="#172554" font-size="30" font-weight="700">Cache</text>
    </g>
    <g transform="translate(1200 300)">
      <rect width="280" height="300" rx="34" fill="#ffffff"/>
      <path d="M70 112h140M70 166h140" stroke="#1d4ed8" stroke-width="24" stroke-linecap="round"/>
      <circle cx="92" cy="112" r="7" fill="#dbeafe"/>
      <circle cx="92" cy="166" r="7" fill="#dbeafe"/>
      <text x="140" y="278" fill="#172554" font-size="30" font-weight="700">Gateway</text>
    </g>
  </g>
  <g fill="#dbeafe">
    <path d="M410 450l34-24v48z"/>
    <path d="M775 450l34-24v48z"/>
    <path d="M1140 450l34-24v48z"/>
  </g>
  <text x="800" y="130" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="64" font-weight="760" text-anchor="middle">Explicit SSR Pipeline</text>
  <text x="800" y="200" fill="#bfdbfe" font-family="Inter,Arial,sans-serif" font-size="30" text-anchor="middle">request → policy → data → document</text>
</svg>
