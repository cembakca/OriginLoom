packages:
  - "packages/*"
  - "apps/*"
  - "tools/*"

allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  libxmljs2: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

overrides:
  autocannon>hyperid: ^4.0.0
  fast-uri: ^3.1.5
  xmlbuilder2>js-yaml: ^4.3.1
  nanoid: ^3.3.18
  postcss: ^8.5.23

peerDependencyRules:
  ignoreMissing:
    - "@napi-rs/wasm-runtime"
