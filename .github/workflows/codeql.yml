name: CodeQL

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  # analyze reads the workflow run it belongs to; without this it fails with
  # "Resource not accessible by integration" after a full 4-minute scan.
  actions: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A skipped job reads as "nothing to see here". This one always runs and says
  # out loud whether the repository is actually being scanned, because "we have
  # CodeQL" and "CodeQL analysed this commit" are different claims and only the
  # second one is a control.
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report SAST coverage
        run: |
          if [[ "${{ github.event.repository.private }}" == "false" ]]; then
            echo "✅ CodeQL bu commit'i tarıyor." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "⚠️ **CodeQL bu depoda çalışmıyor.**"
              echo
              echo "Sonuçları yüklemek code scanning gerektiriyor; private bir depoda o da"
              echo "GitHub Advanced Security (ücretli) demek. Onsuz tarama dört dakika koşup"
              echo "yükleme adımında düşüyor, yani yeşil bir CI yanlış bir güven üretiyordu."
              echo
              echo "Yani şu an **SAST kapsamımız yok**. Depo public olduğunda ya da GHAS"
              echo "açıldığında kendiliğinden başlar; o zamana kadar bu satır kaydın kendisidir."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  analyze:
    # Uploading results needs code scanning, which on a private repository needs
    # GitHub Advanced Security — a paid add-on. Without it the scan runs for four
    # minutes and then fails on the upload, so it is skipped until the repository
    # is public or GHAS is enabled, at which point this starts working by itself.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
