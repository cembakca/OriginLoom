services:
  mock-gw:
    build: ./mock-gw
    ports:
      - "4002:4002"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: production
      PORT: 3005
      CACHE_BACKEND: redis
      CACHE_REQUIRED: "false"
      REDIS_URL: redis://redis:6379
      CACHE_FILL_TIMEOUT_MS: 12000
      CACHE_FILL_WAIT_MS: 12500
      CACHE_FILL_POLL_MS: 100
      GATEWAY_URL: ${GATEWAY_URL:-http://mock-gw:4002}
      GTM_CONTAINER_ID: GTM-XXXXXX
      SITE_URL: http://localhost:3005
      RELEASE_ID: docker-compose
      OTEL_SDK_DISABLED: "false"
      # Opsiyonel OTLP/HTTP collector; tanımlı değilse tracing no-op çalışır.
      # OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      MENU_CACHE_TTL: 14400
      CACHE_PURGE_SECRET: ${CACHE_PURGE_SECRET:-dev-purge-secret}
      # Statik JS/CSS CDN — boş bırakılırsa origin /assets kullanılır
      # ASSET_CDN_URL: https://cdn.hangikredi.com
      # Dönüşümsüz image dosyaları için path-preserving CDN prefix
      # IMAGE_CDN_URL: https://cdn.hangikredi.com/images
      IMAGE_CDN_URL: http://localhost:3005
      # Responsive image transformer — url,w,q,format query kontratı
      # IMAGE_TRANSFORM_URL: https://images.hangikredi.com/transform
    depends_on:
      mock-gw:
        condition: service_healthy
      redis:
        condition: service_healthy
