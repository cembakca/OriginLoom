services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: production
      PORT: 3005
      CACHE_BACKEND: redis
      REDIS_URL: redis://redis:6379
      GTM_CONTAINER_ID: GTM-XXXXXX
      SITE_URL: http://localhost:3005
      MENU_CACHE_TTL: 14400
      CACHE_PURGE_SECRET: ${CACHE_PURGE_SECRET:-dev-purge-secret}
      # Statik JS/CSS CDN — boş bırakılırsa origin /assets kullanılır
      # ASSET_CDN_URL: https://cdn.hangikredi.com
    depends_on:
      redis:
        condition: service_healthy
