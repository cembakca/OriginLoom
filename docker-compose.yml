services:
  mock-gw:
    build: ./mock-gw
    ports:
      - "4002:4002"
    environment:
      MARKET_STREAM_TOKEN: dev-market-stream-token

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "3005:3005"
    env_file:
      - .env.production
    environment:
      # Override cluster-internal hostnames and secrets for local Docker simulation
      GATEWAY_URL: http://mock-gw:4002
      REDIS_URL: redis://redis:6379
      RELEASE_ID: docker-compose
      SITE_URL: http://localhost:3005
      CACHE_PURGE_SECRET: dev-purge-secret
      REFERRAL_STATS_SECRET: dev-referral-stats-secret
      MARKET_STREAM_TOKEN: dev-market-stream-token
      ALLOW_INSECURE_GATEWAY: "true"
      ALLOW_INSECURE_REDIS: "true"
      TRUSTED_PROXY_HOPS: "1"
      TRUSTED_PROXY_CIDRS: "172.16.0.0/12"
    depends_on:
      mock-gw:
        condition: service_healthy
      redis:
        condition: service_healthy
