services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: production
      PORT: 3005
      CACHE_BACKEND: redis
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
