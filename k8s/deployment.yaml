apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssr-kit
  labels:
    app: ssr-kit
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ssr-kit
  template:
    metadata:
      labels:
        app: ssr-kit
    spec:
      containers:
        - name: ssr-kit
          image: ssr-kit:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3005
          envFrom:
            - configMapRef:
                name: ssr-kit-config
            - secretRef:
                name: ssr-kit-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3005
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3005
            initialDelaySeconds: 5
            periodSeconds: 10
