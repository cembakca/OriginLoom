apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ssr-kit-cache-cardinality
  labels:
    app: ssr-kit
spec:
  groups:
    - name: ssr-kit.cache
      rules:
        - alert: SsrCacheCardinalityWindowNearLimit
          expr: max by (route) (ssr_cache_distinct_keys_observed) > 1600
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "SSR cache key cardinality is approaching its observation limit"
            description: "Route {{ $labels.route }} has observed more than 1600 distinct keys in one process."

        - alert: SsrCacheCardinalityOverflow
          expr: sum by (route) (increase(ssr_cache_cardinality_overflow_total[5m])) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "SSR cache key cardinality exceeded the bounded observation window"
            description: "Route {{ $labels.route }} is producing unbounded or unexpectedly diverse cache keys."

        - alert: SsrCacheEntryBodyTooLarge
          expr: histogram_quantile(0.95, sum by (route, le) (rate(ssr_cache_entry_body_bytes_bucket[10m]))) > 524288
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "SSR cached HTML body p95 exceeds 512 KiB"
            description: "Route {{ $labels.route }} is producing unusually large cached responses."

        - alert: SsrGatewayInvalidPayload
          expr: sum by (contract, reason) (increase(ssr_gateway_invalid_payload_total[10m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Gateway response violated an SSR consumer contract"
            description: "Contract {{ $labels.contract }} rejected a gateway payload because of {{ $labels.reason }}."

        - alert: SsrColdCacheFillTimeout
          expr: sum(increase(ssr_cache_fill_total{outcome="timeout"}[10m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Cold cache loader/render exceeded its execution budget"
            description: "At least one cold cache fill timed out during the last 10 minutes."

        - alert: SsrColdMissLockTimeout
          expr: sum(increase(ssr_cache_lock_timeout_total[10m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Cold miss wait exhausted the distributed lock budget"
            description: "A request rendered an uncached fallback after waiting for another pod's cache fill."

        - alert: SsrBotAnalyticsQueueFullDrops
          expr: sum(increase(ssr_bot_analytics_dropped_total{reason="queue_full"}[10m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Bot analytics queue is dropping events"
            description: "At least one bot analytics event was dropped because the bounded queue was full."

        - alert: SsrBotAnalyticsDeliveryFailures
          expr: sum(increase(ssr_bot_analytics_batches_total{outcome=~"rejected|error"}[10m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Bot analytics batch delivery is failing"
            description: "The gateway rejected a bot analytics batch or its delivery failed during the last 10 minutes."

        - alert: SsrBotAnalyticsDrainTimeout
          expr: sum(increase(ssr_bot_analytics_drains_total{outcome="timeout"}[10m])) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Bot analytics queue did not drain during shutdown"
            description: "A terminating SSR process exhausted its bot analytics drain budget and dropped pending events."

    - name: ssr-kit.slo
      rules:
        - alert: SsrAvailabilityLow
          expr: sum(rate(ssr_http_requests_total{status_class!~"5xx"}[5m])) / sum(rate(ssr_http_requests_total[5m])) < 0.995
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "SSR application availability is below SLO"
            description: 'The availability of the SSR application over the last 5 minutes is {{ $value | printf "%.2f" }}%.'

        - alert: SsrHigh5xxRate
          expr: sum(rate(ssr_http_requests_total{status_class="5xx"}[5m])) / sum(rate(ssr_http_requests_total[5m])) > 0.005
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "High 5xx error rate detected"
            description: '5xx responses constitute {{ $value | printf "%.2f" }}% of total requests.'

        - alert: SsrLatencyP95TooHigh
          expr: histogram_quantile(0.95, sum by (le) (rate(ssr_http_request_duration_milliseconds_bucket[5m]))) > 2000
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "SSR request p95 latency is high"
            description: "The 95th percentile of SSR request latency is {{ $value }}ms."

        - alert: SsrLatencyP99TooHigh
          expr: histogram_quantile(0.99, sum by (le) (rate(ssr_http_request_duration_milliseconds_bucket[5m]))) > 5000
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "SSR request p99 latency is high"
            description: "The 99th percentile of SSR request latency is {{ $value }}ms."

        - alert: SsrGatewayTimeoutRateHigh
          expr: sum(rate(ssr_gateway_requests_total{outcome="timeout"}[5m])) / sum(rate(ssr_gateway_requests_total[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High gateway timeout rate"
            description: 'Gateway timeouts constitute {{ $value | printf "%.2f" }}% of total gateway requests.'

        - alert: SsrRedisOperationsFailed
          expr: sum(rate(ssr_cache_operations_total{backend="redis",outcome="error"}[5m])) / sum(rate(ssr_cache_operations_total{backend="redis"}[5m])) > 0.05
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Redis operations are failing"
            description: 'Redis operation error rate is {{ $value | printf "%.2f" }}%.'

        - alert: SsrRedisOperationsSlow
          expr: histogram_quantile(0.95, sum by (le) (rate(ssr_cache_operation_duration_milliseconds_bucket{backend="redis"}[5m]))) > 50
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Redis operations are slow (potential saturation)"
            description: "Redis operation p95 duration is {{ $value }}ms."

        - alert: SsrQueueDepthHigh
          expr: ssr_render_queue_depth > 30
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "SSR render queue depth is high (saturation risk)"
            description: "SSR render queue depth is currently {{ $value }}."

        - alert: SsrRenderRejectionsHigh
          expr: sum(increase(ssr_render_rejections_total[5m])) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "SSR requests are being rejected due to capacity limit"
            description: "SSR capacity rejections are occurring ({{ $value }} rejections in the last 5 minutes)."
