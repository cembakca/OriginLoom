apiVersion: v1
kind: ConfigMap
metadata:
  name: origin-loom-config
data:
  NODE_ENV: production
  PORT: "3005"
  METRICS_PORT: "9090"
  CLIENT_ERROR_RATE_LIMIT: "120"
  CLIENT_ERROR_WINDOW_MS: "60000"
  CLIENT_ERROR_SAMPLE_RATE: "1"
  CLIENT_ERROR_IP_RATE_LIMIT: "20"
  CLIENT_ERROR_IP_MAX_ENTRIES: "10000"
  CLIENT_ERROR_IP_TTL_MS: "300000"
  MARKET_STREAM_MAX_CONNECTIONS: "1000"
  MARKET_STREAM_MAX_CONNECTIONS_PER_IP: "5"
  MARKET_STREAM_MAX_SYMBOLS: "25"
  MARKET_STREAM_MAX_DURATION_MS: "300000"
  MARKET_STREAM_HEARTBEAT_MS: "15000"
  CACHE_BACKEND: memory
  CACHE_REQUIRED: "false"
  CACHE_MAX_ENTRIES: "2000"
  GATEWAY_URL: https://gateway.example.com
  SITE_URL: https://www.example.com
  RELEASE_ID: "replace-with-release-or-git-sha"
  TRUST_PROXY: "true"
  TRUSTED_PROXY_HOPS: "1"
  TRUSTED_PROXY_CIDRS: "10.0.0.0/8"
  CSP_ENFORCE: "true"
  GATEWAY_TIMEOUT_MS: "5000"
  AUTH_REFRESH_COORDINATION_TTL_MS: "6000"
  SSR_REQUEST_TIMEOUT_MS: "15000"
  API_REQUEST_TIMEOUT_MS: "12000"
  PROXY_REQUEST_TIMEOUT_MS: "8000"
  SSR_MAX_CONCURRENCY: "32"
  SSR_MAX_QUEUE: "64"
  SSR_QUEUE_WAIT_MS: "250"
  CACHE_FILL_TIMEOUT_MS: "12000"
  CACHE_FILL_WAIT_MS: "12500"
  CACHE_FILL_POLL_MS: "100"
  BOT_ANALYTICS_QUEUE_CAPACITY: "1000"
  BOT_ANALYTICS_CONCURRENCY: "2"
  BOT_ANALYTICS_BATCH_SIZE: "25"
  BOT_ANALYTICS_FLUSH_MS: "250"
  BOT_ANALYTICS_DEDUP_TTL_MS: "60000"
  BOT_ANALYTICS_SAMPLE_RATE: "1"
  BOT_ANALYTICS_DRAIN_TIMEOUT_MS: "3000"
  PROXY_BODY_LIMIT_BYTES: "1048576"
  REDIRECT_CACHE_TTL_MS: "60000"
  REDIRECT_CACHE_MAX_ENTRIES: "10000"
  REDIRECT_ALLOWED_HOSTS: www.example.com
  SHUTDOWN_TIMEOUT_MS: "10000"
  SWR_REVALIDATION_ATTEMPTS: "3"
  SWR_REVALIDATION_BACKOFF_MS: "250"
  SWR_DRAIN_TIMEOUT_MS: "5000"
