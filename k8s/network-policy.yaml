apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ssr-kit-ingress-boundary
spec:
  podSelector:
    matchLabels:
      app: ssr-kit
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3005
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: operations
      ports:
        - protocol: TCP
          port: 9090
