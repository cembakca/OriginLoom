apiVersion: v1
kind: Secret
metadata:
  name: origin-loom-secrets
type: Opaque
stringData:
  # Replace through your secret manager; do not commit real credentials.
  # Optional — required only when CACHE_BACKEND=redis (see k8s/configmap.redis.yaml overlay).
  REDIS_URL: rediss://managed-redis.example.internal:6379
  CACHE_PURGE_SECRET: replace-with-a-long-random-secret
  REFERRAL_STATS_SECRET: replace-with-a-different-long-random-secret
  MARKET_STREAM_TOKEN: replace-with-an-internal-market-stream-secret
  AUTH_REFRESH_COORDINATION_SECRET: replace-with-a-dedicated-long-random-auth-coordination-secret
  AUTH_REFRESH_COORDINATION_PREVIOUS_SECRET: ""
